name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, build, and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: orbyte_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: orbyte_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orbyte_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: orbyte_ci
      PGUSER: postgres
      PGPASSWORD: orbyte_ci_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.1"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Initialize test PostgreSQL schema
        run: node scripts/init-postgres.mjs

      - name: Lint
        run: npm run lint

      - name: Check deployment script syntax
        run: bash -n scripts/deploy-release.sh

      - name: Test data migration
        run: node --test tests/migration.test.mjs

      - name: Build production application
        run: npm run build

      - name: Prepare standalone release
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          printf '%s\n' "$GITHUB_SHA" > .next/standalone/REVISION
          mkdir -p .next/standalone/scripts .next/standalone/lib
          cp lib/postgres.mjs .next/standalone/lib/
          cp scripts/schema.sql scripts/init-postgres.mjs scripts/check-postgres.mjs scripts/import-sqlite.mjs scripts/show-leads.mjs .next/standalone/scripts/

      - name: Test production release
        env:
          HOSTNAME: 127.0.0.1
          PORT: "3000"
          NODE_ENV: production
        run: |
          node .next/standalone/server.js > "$RUNNER_TEMP/orbyte-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/orbyte-server.log"' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 --retry-max-time 45 http://127.0.0.1:3000/ > "$RUNNER_TEMP/orbyte-home.html"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const base = 'http://127.0.0.1:3000';
          const html = fs.readFileSync(`${process.env.RUNNER_TEMP}/orbyte-home.html`, 'utf8');
          assert.ok(html.includes('Orbyte Cloud'));
          const script = html.match(/src="([^\"]*\/_next\/static\/[^\"]+\.js[^\"]*)"/);
          assert.ok(script, 'Homepage must reference a JavaScript asset');
          for (const path of ['/favicon.svg', script[1].replaceAll('&amp;', '&')]) {
            assert.equal((await fetch(new URL(path, base))).status, 200, path);
          }
          const post = body => fetch(`${base}/api/consultations`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body),
          });
          assert.equal((await post({})).status, 400);
          const email = `ci-${Date.now()}@example.invalid`;
          const saved = await post({name: 'CI smoke test', email, service: 'Deployment verification'});
          assert.equal(saved.status, 201);
          assert.equal((await saved.json()).ok, true);
          const admin = await fetch(`${base}/admin`);
          assert.equal(admin.status, 200);
          assert.ok((await admin.text()).includes(email), 'Saved request must appear in dashboard');
          console.log('PASS: homepage, static assets, validation, PostgreSQL storage, and dashboard');
          NODE

      - name: Package tested release
        run: tar -czf orbyte-release.tar.gz -C .next/standalone .

      - name: Save deployment artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbyte-release-${{ github.sha }}
          path: orbyte-release.tar.gz
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ORBYTE_RDS_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: http://13.206.108.114
    concurrency:
      group: orbyte-production
      cancel-in-progress: false
    steps:
      - name: Download tested release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orbyte-release-${{ github.sha }}
          path: release

      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/orbyte-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/orbyte-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/orbyte-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/orbyte-ssh/key" > /dev/null

      - name: Deploy and check release on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          digest=$(sha256sum release/orbyte-release.tar.gz | cut -d ' ' -f 1)
          ssh -T -i "$RUNNER_TEMP/orbyte-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/orbyte-ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$SSH_USER@$SSH_HOST" \
            "deploy $GITHUB_SHA $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT $digest" \
            < release/orbyte-release.tar.gz

      - name: Check public website
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          curl --fail --silent --show-error --max-time 20 "http://$SSH_HOST/" -o "$RUNNER_TEMP/orbyte-live.html"
          grep -q 'Orbyte Cloud' "$RUNNER_TEMP/orbyte-live.html"
          status=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "http://$SSH_HOST/admin")
          test "$status" = 403

      - name: Remove temporary SSH files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/orbyte-ssh"
